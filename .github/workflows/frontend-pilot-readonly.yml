name: Alpen Crew — Public Category + Product Responsive QA (NO SECRETS)

on:
  push:
    branches:
      - execution/2026-11-03-alpencrew-safety-pilot
    paths:
      - "scripts/frontend_pilot_smoke.py"
      - ".github/workflows/frontend-pilot-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-pilot:
    name: Public read-only responsive QA
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Check five pages on mobile and desktop (no clicks, no forms)
        run: python scripts/frontend_pilot_smoke.py
      - name: Keep public screenshots and JSON for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpencrew-public-frontend-product-category-qa
          path: frontend-pilot-out/
          if-no-files-found: ignore
          retention-days: 7
